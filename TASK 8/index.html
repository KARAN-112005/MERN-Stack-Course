<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry Wallah</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">Logo</div>

    <!-- Desktop nav links -->
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">About Us</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>

    <div class="nav-right">
      <span class="username-badge">Username</span>

      <!-- Hamburger button (mobile only) — NO JavaScript, uses :focus -->
      <button class="hamburger" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>

        <!-- Mobile slide-in menu is a CHILD of the button so :focus works -->
        <div class="mobile-menu">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
          </ul>
        </div>
      </button>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <h1>
        Revitalize Your Clothes with Expert
        <span class="highlight">Laundry Services!</span>
      </h1>
      <p>
        From premium dry cleaning to swift wash and fold, we deliver care and
        convenience. Schedule a pickup and rediscover the freshness of your
        clothes today!
      </p>
      <a href="#" class="cta-btn">Book a service today!</a>
    </div>
    <div class="hero-image">
      <img src="washingmachine.png" alt="Laundry machine illustration" />
    </div>
  </section>

</body>
</html>
