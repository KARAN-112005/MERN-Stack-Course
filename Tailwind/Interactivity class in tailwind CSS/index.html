<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactivity class in tailwind CSS</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <button class="bg-blue-400 p-2 m-2 rounded-md text-white block">
        Simple Button
    </button>

    <button class="bg-blue-400 p-2 m-2 rounded-md text-white block hover:bg-blue-700 hover:text-yellow-400">
        Hover Button
    </button>

    <button class="bg-blue-400 p-2 m-2 rounded-md text-white block focus:bg-yellow-400">
        Focus Button
    </button>

    <button class="bg-blue-400 p-2 m-2 rounded-md text-white block active:bg-green-400">
        Active Button
    </button>

     <button class="bg-blue-400 p-2 m-2 rounded-md text-white block focus:bg-yellow-400 hover:text-yellow-400 active:bg-green-400">
        Simple Button
    </button>

                Lorem ipsum dolor sit amet consectetur, adipisicing elit.

</html>
