<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Left Section: Illustration -->
        <div class="left-section">
            <img src="washingmachine.png" alt="Washing Machine Illustration">
        </div>

        <!-- Right Section: Login Form -->
        <div class="right-section">
            <h1>Hello Again!</h1>
            <p class="subtext">Welcome back! we missed you!</p>

            <form>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Emailid@site.com">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password">

                <a href="#" class="forgot-link">Forgot Password</a>

                <button type="button" class="login-btn">Login</button>

                <p class="register-text">Not a member? <a href="#">Register Now</a></p>
            </form>
        </div>

    </div>

</body>
</html>
